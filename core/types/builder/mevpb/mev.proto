syntax = "proto3";

package mev.v1;

option go_package = "github.com/ethereum/go-ethereum/core/types/builder/mevpb;mevpb";

// BidBlockService accepts BEP-675 BidBlock submissions over gRPC.
// Other MEV APIs remain on JSON-RPC.
service BidBlockService {
  rpc SendBidBlock(BidBlockRequest) returns (BidBlockResponse);
}

message BidBlockRequest {
  // RLP encoding of buildertypes.BidBlock.
  bytes bid_block_rlp = 1;

  // Builder ECDSA signature over BidBlock.Hash().
  bytes signature = 2;

  // Used by sentry routing. Validators intentionally ignore it.
  string validator_host_name = 3;

  reserved 4 to 10;

  // bsc-mev-validator extension: the nontaxableFee argument of mev_sendBidBlock,
  // so that a BidBlock sent over gRPC can carry it like one sent over JSON-RPC.
  // Lower bound of the direct transfer to the validator's bid-fee EOA, in wei,
  // unsigned big-endian (at most 32 bytes). Empty = not asserted.
  //
  // Plain proto3 compatibility: a client built from the upstream proto never
  // sets it and the validator reads "not asserted", the behaviour before this
  // field existed; a server built from the upstream proto skips it as an
  // unknown field. The number stays clear of the upstream range (1-3 used,
  // 4-10 reserved) and below 2048, so the tag takes two bytes.
  bytes nontaxable_fee = 481;

  // 482-484 are used by the 48club validator fork for its own arguments.
  reserved 482 to 484;
}

message BidBlockResponse {
  bytes bid_hash = 1;
}
